<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="京葉線">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>稲毛海岸 京葉線 時刻表</title>
<style>
:root{
 color-scheme:light dark;
 --bg:#f2f2f7;--text:#000;--sub:rgba(60,60,67,.6);--sep:rgba(60,60,67,.18);
 --card:rgba(255,255,255,.72);--glass:rgba(255,255,255,.5);--glass-edge:rgba(255,255,255,.75);--glass-hi:rgba(255,255,255,.9);
 --shadow:0 10px 30px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.06);
 --line:#c9242f;--rapid:#ff7a00;--ltd:#8e44d8;--local:#8e8e93;--blue:#007aff;
 --bar:rgba(250,250,252,.72);--blob1:rgba(201,36,47,.20);--blob2:rgba(0,122,255,.14);--blob3:rgba(142,68,216,.12);
}
@media(prefers-color-scheme:dark){:root{
 --bg:#000;--text:#fff;--sub:rgba(235,235,245,.6);--sep:rgba(84,84,88,.55);
 --card:rgba(44,44,46,.62);--glass:rgba(58,58,60,.45);--glass-edge:rgba(255,255,255,.14);--glass-hi:rgba(255,255,255,.18);
 --shadow:0 10px 30px rgba(0,0,0,.5);
 --line:#ff4d5a;--rapid:#ff9f0a;--ltd:#bf7cff;--local:#98989d;--blue:#0a84ff;
 --bar:rgba(30,30,32,.72);--blob1:rgba(255,77,90,.20);--blob2:rgba(10,132,255,.16);--blob3:rgba(191,124,255,.14);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:.01em}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
 background:radial-gradient(40% 30% at 15% 10%,var(--blob1),transparent 70%),radial-gradient(45% 35% at 90% 25%,var(--blob2),transparent 70%),radial-gradient(50% 35% at 50% 95%,var(--blob3),transparent 70%)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);
 border:.5px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow)}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 110px)}

/* ヘッダー */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.clock{font-size:15px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px}
.pill{height:36px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:transform .15s}
.pill:active{transform:scale(.94)}
.pill[aria-pressed=true]{background:var(--rapid);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(255,122,0,.35)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.7}
h1{font-size:34px;line-height:1.15;font-weight:800;letter-spacing:-.02em;margin:10px 4px 2px}
.from{margin:0 4px 14px;font-size:15px;color:var(--sub);font-weight:500}

/* セグメント */
.seg{display:flex;padding:3px;border-radius:999px;margin-bottom:14px;position:relative}
.seg button{flex:1;height:34px;border-radius:999px;font-size:14px;font-weight:600;color:var(--sub);position:relative;z-index:1;transition:color .2s}
.seg button[aria-selected=true]{color:var(--text)}
.seg .thumb{position:absolute;top:3px;bottom:3px;border-radius:999px;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.12),inset 0 1px 0 var(--glass-hi);transition:left .3s cubic-bezier(.3,1.3,.5,1),width .3s}

/* 次の列車 */
.hero{border-radius:30px;padding:20px 20px 8px;margin-bottom:22px}
.hero-main{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:16px}
.hero .t{font-size:56px;line-height:1;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero .cd{text-align:right}
.hero .cd b{display:block;white-space:nowrap;font-size:30px;line-height:1;font-weight:800;color:var(--line);font-variant-numeric:tabular-nums}
.hero .cd b.long{font-size:22px}
.hero .cd b.soon{animation:pulse 1.2s ease-in-out infinite}
.hero .cd small{font-size:13px;color:var(--sub);font-weight:600}
@keyframes pulse{50%{opacity:.45}}
.hero .meta{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px;color:var(--sub);flex-wrap:wrap}
.hero .rows{border-top:.5px solid var(--sep)}

.badge{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;letter-spacing:.02em}
.badge.n{background:rgba(142,142,147,.16);color:var(--local)}
.badge.k{background:rgba(255,122,0,.15);color:var(--rapid)}
.badge.x{background:var(--ltd);color:#fff}
.note{font-size:12px;color:var(--rapid);font-weight:600}
.hero-main.has-sub{padding-bottom:6px}
.hero-sub{padding-bottom:16px}
.hero .arr{margin-top:0;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.hero .xf{margin-top:4px;font-size:14px;color:var(--sub);font-weight:600}
.hero .xf b{color:var(--blue)}

.row{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 0;border-bottom:.5px solid var(--sep)}
.row:last-child{border-bottom:0}
.row .t{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;min-width:3.3em}
.row .d{font-size:15px;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .d small{display:block;font-size:12px;color:var(--sub)}
.row .m{font-size:15px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}

.sec{font-size:13px;font-weight:600;color:var(--sub);margin:0 20px 8px;text-transform:uppercase}
.list{border-radius:26px;padding:0 18px;background:var(--card);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:.5px solid var(--glass-edge)}
.list .t{font-size:18px}
.stale{display:none;margin:0 0 10px;padding:10px 14px;border-radius:14px;background:rgba(215,0,21,.12);color:#d70015;font-size:14px;font-weight:600;line-height:1.4}
.stale.on{display:block}
.stamp{margin:6px 0 0;font-size:12px;color:var(--sub)}
.stamp.warn{color:var(--red,#d70015);font-weight:600}
.more{display:block;width:100%;min-height:48px;font-size:15px;font-weight:600;color:var(--blue)}
.empty{padding:22px 4px 26px;font-size:16px;color:var(--sub);text-align:center;line-height:1.6}
.empty b{display:block;color:var(--text);font-size:20px;margin-bottom:4px}

.foot{margin:24px 4px 0;font-size:12px;color:var(--sub);line-height:1.7;text-align:center}
.foot p{margin:8px 0 0}
.foot .info{display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:999px;color:var(--blue);text-decoration:none;font-size:15px;font-weight:600}
.foot details{margin-top:6px}
.foot summary{list-style:none;cursor:pointer;color:var(--sub);font-weight:600}
.foot summary::-webkit-details-marker{display:none}
.foot summary::after{content:" ›";display:inline-block;transition:transform .2s}
.foot details[open] summary::after{transform:rotate(90deg)}

/* 下のタブバー（浮いたガラス） */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(380px,calc(100% - 40px));
 display:flex;padding:5px;border-radius:999px;z-index:10}
.tabbar{background:var(--bar)}
.tabbar button{flex:1;height:54px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--text);opacity:.75;transition:background .25s,opacity .25s}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-selected=true]{opacity:1;color:var(--line);background:rgba(127,127,127,.16)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
 <div class="stale" id="stale" role="alert"></div>
 <div class="top">
  <span class="clock" id="clock"></span>
  <div class="tools">
   <button class="pill glass" id="kbtn" aria-pressed="false">快速のみ</button>
   <button class="pill glass" id="daybtn"></button>
  </div>
 </div>
 <h1 id="title"></h1>
 <div class="from" id="from"></div>
 <div class="seg glass" id="seg" role="tablist"></div>
 <div id="out"></div>
 <div class="foot">
  <a class="info glass" href="https://traininfo.jreast.co.jp/train_info/line.aspx?gid=1&amp;lineid=keiyoline" target="_blank" rel="noopener">運行情報を見る ›</a>
  <p>遅延は反映されません</p>
  <p class="stamp" id="stamp"></p>
  <details><summary>このアプリについて</summary>
   <p>JR東日本の駅時刻表を毎日自動で確認しています。臨時ダイヤには未対応です。特急は特急券が必要です。<br><span id="meta"></span></p>
  </details>
 </div>
</div>

<nav class="tabbar glass" id="tabbar" role="tablist"></nav>

<script>
const NAMES={習:"新習志野",西:"西船橋",府:"府中本町",所:"東所沢",安:"安房鴨川",勝:"勝浦",館:"館山",一:"上総一ノ宮",君:"君津",成:"成東",誉:"誉田","一・成":"上総一ノ宮・成東",幕:"海浜幕張"};
const HOL=["2026-11-23","2027-01-01","2027-01-11","2027-02-11","2027-02-23","2027-03-21","2027-03-22","2027-04-29","2027-05-03","2027-05-04","2027-05-05","2027-07-19","2027-08-11","2027-09-20","2027-09-23","2027-10-11","2027-11-03","2027-11-23"];
const ICON={
 go:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="14" rx="4"/><path d="M5 11h14M9 21l-2 0M8 17l-2 4M16 17l2 4"/><circle cx="9" cy="14" r=".6" fill="currentColor"/><circle cx="15" cy="14" r=".6" fill="currentColor"/></svg>',
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>',
 ltd:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>'
};
// 東京行きの表示から外す行き先（東京まで行かない列車）
const NOT_TOKYO=["習","西","府","所"];
const GROUPS=[
 {id:"go",label:"行き",icon:"go",routes:[
  {seg:"海浜幕張",title:"海浜幕張方面",from:"稲毛海岸 発",src:"U",def:"東京",excl:[],arr:0,at:"海浜幕張"},
  {seg:"東京",title:"東京方面",from:"稲毛海岸 発",src:"U",def:"東京",excl:NOT_TOKYO,arr:1,at:"東京",xfer:true}
 ]},
 {id:"home",label:"帰り",icon:"home",routes:[
  {seg:"海浜幕張",title:"稲毛海岸へ",from:"海浜幕張 発",src:"K",def:"蘇我",excl:[],noPass:true,arr:0,at:"稲毛海岸"},
  {seg:"東京",title:"稲毛海岸へ",from:"東京 発",src:"T",def:"蘇我",excl:["府","西","所","習","幕"],needArr:true,arr:1,at:"稲毛海岸"}
 ]},
 {id:"ltd",label:"特急",icon:"ltd",routes:[
  {seg:"海浜幕張 → 東京",title:"特急で東京へ",from:"海浜幕張 発",src:"M",def:"東京",excl:NOT_TOKYO,ltd:true,arr:0,at:"東京"},
  {seg:"東京 → 海浜幕張",title:"特急で海浜幕張へ",from:"東京 発",src:"T",def:"蘇我",excl:[],ltd:true,arr:0,at:"海浜幕張"}
 ]}
];
const st={g:0,r:[0,0,0],k:false,day:"auto",open:false};
const MORE_N=8; // 「この後の発車」を最初に出す本数
// v2: 行きの並びを「海浜幕張・東京」に変えたので、前の形式の保存値は使わない
try{const o=JSON.parse(localStorage.getItem("keiyo-st2")||"{}");Object.assign(st,o,{day:"auto"})}catch(e){}
const save=()=>{try{localStorage.setItem("keiyo-st2",JSON.stringify({g:st.g,r:st.r,k:st.k}))}catch(e){}};

const pad=n=>String(n).padStart(2,"0");
function jst(){const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).reduce((a,x)=>(a[x.type]=x.value,a),{});return{y:+p.year,mo:+p.month,d:+p.day,h:+p.hour,mi:+p.minute,s:+p.second}}
const ymd=(y,m,d)=>y+"-"+pad(m)+"-"+pad(d);
function addDay(y,m,d,n){const t=new Date(Date.UTC(y,m-1,d+n));return{y:t.getUTCFullYear(),mo:t.getUTCMonth()+1,d:t.getUTCDate()}}
function dayType(y,m,d){const w=new Date(Date.UTC(y,m-1,d)).getUTCDay();return(w===0||w===6||HOL.includes(ymd(y,m,d)))?"hd":"wd"}
const fmt=m=>Math.floor(m/60)%24+":"+pad(m%60);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let DATA=null;
// 古い形式（[分, 快速0/1, 行き先]）にも対応
const rows=(src,type)=>(DATA.tables[src+"_"+type]||[]).map(r=>({m:r[0],kind:r[1]===true?1:+r[1]||0,d:r[2]??null,name:r[3]??null,x:r[4]??null,c:!!r[5],arr:r[6]||null,ni:r[7]??null}));
const route=()=>GROUPS[st.g].routes[st.r[st.g]]||GROUPS[st.g].routes[0];
// ---- 乗り換え検索 ----
// net[type] = [[種別, [駅0着,駅0発,駅1着,駅1発,...]], ...]（駅は net.st の順、東京が最後）
const XFER_MIN=1; // 乗り換えに最低この分数
const MAX_XFER=2;
const PLAN={};
function plans(type){
 if(PLAN[type])return PLAN[type];
 const net=DATA.net&&DATA.net[type];
 if(!net)return PLAN[type]=null;
 const N=DATA.net.st.length,TOK=N-1;
 // 各列車の停車駅を時刻順に並べておく
 const stops=net.map(([k,v])=>{if(!v||k===2)return[];const o=[];for(let s=0;s<N;s++)if(v[2*s]!=null)o.push(s);return o.sort((x,y)=>v[2*x]-v[2*y])});
 const A=(j,s)=>net[j][1][2*s],D=(j,s)=>net[j][1][2*s+1];
 return PLAN[type]=i=>{
  if(!net[i]||!net[i][1]||net[i][1][1]==null)return null;
  const best=new Array(N).fill(Infinity);
  let cur=new Array(N).fill(null),res=null;
  const dep0=D(i,0);
  for(const s of stops[i]){if(s===0)continue;const a=A(i,s);best[s]=a;cur[s]={t:a,legs:[{j:i,from:0,dep:dep0,to:s,arr:a}]}}
  if(cur[TOK])res=cur[TOK];
  for(let k=1;k<=MAX_XFER;k++){
   const nx=new Array(N).fill(null);let any=false;
   for(let j=0;j<net.length;j++){
    let on=null;
    for(const s of stops[j]){
     if(on){const a=A(j,s);if(a<best[s]){best[s]=a;nx[s]={t:a,legs:[...on.legs,{j,from:on.s,dep:on.d,to:s,arr:a}]};any=true}}
     const L=cur[s];
     // できるだけ長く今の列車に乗り、最後に間に合う駅で乗り換える
     if(L&&L.legs[L.legs.length-1].j!==j&&D(j,s)>=L.t+XFER_MIN)on={s,d:D(j,s),legs:L.legs};
    }
   }
   if(nx[TOK])res=nx[TOK];
   if(!any)break;
   cur=nx;
  }
  if(!res)return null;
  return{at:res.t,n:res.legs.length-1,legs:res.legs.map(l=>({...l,kind:net[l.j][0]}))};
 };
}
function list(rt,type){
 const P=rt.xfer&&DATA.net?plans(type):null;
 let all=rows(rt.src,type);
 // 行き先の駅に停まらない列車（通過）は出さない。到着時刻が全く取れていない日は、絞らずに全部出す
 if(rt.needArr){const base=all.filter(t=>!(t.d&&rt.excl.includes(t.d))&&t.kind!==2);
  if(base.filter(t=>t.arr).length>=base.length*0.5)all=all.filter(t=>t.arr&&t.arr[rt.arr]!=null)}
 return all.filter(t=>{
  if(P){t.best=t.ni!=null?P(t.ni):null;if(!t.best)return false}
  else if(t.d&&rt.excl.includes(t.d))return false;
  if(rt.ltd)return t.kind===2;
  if(rt.noPass&&t.x==="通過")return false;
  if(t.kind===2)return false;
  return !st.k||t.kind===1;
 });
}
function badge(t,short){return t.kind===2?`<span class="badge x">特急${t.name&&!short?" "+esc(t.name):""}</span>`:t.kind===1?'<span class="badge k">快速</span>':'<span class="badge n">各停</span>'}
function destText(t,rt){return (t.d?(NAMES[t.d]||t.d):rt.def)+" 行"}
const arrOf=(t,rt)=>t.best?t.best.at:t.arr&&t.arr[rt.arr]!=null?t.arr[rt.arr]:null;
const stName=s=>DATA.net.st[s];
const kindName=k=>k===1?"快速":"各停";
const xferText=t=>!t.best?"":t.best.n?`乗換${t.best.n}回（${t.best.legs.slice(1).map(l=>stName(l.from)).join("・")}）`:"乗換なし";
function arrText(t,rt){const a=arrOf(t,rt);return a==null?"":`${rt.at} ${fmt(a)} 着（${a-t.m}分）`}
function xferLine(t){
 if(!t.best)return"";const b=t.best;
 if(!b.n)return`<div class="xf"><b>乗換なし</b>・そのまま東京へ</div>`;
 const steps=b.legs.slice(1).map((l,n)=>`${stName(l.from)} ${fmt(b.legs[n].arr)} 着 → ${fmt(l.dep)} 発の${kindName(l.kind)}へ`);
 return`<div class="xf"><b>乗換${b.n}回</b>・${steps.join("<br>")}</div>`}
function subText(t,rt,withName){const a=[];const ar=withName?arrOf(t,rt):null;if(ar!=null)a.push(`${fmt(ar)} 着`);if(withName&&t.best)a.push(xferText(t));if(withName&&t.kind===2&&t.name)a.push(esc(t.name));if(t.c)a.push("運転日注意");return a.join("・")}
function untilText(t,now){const d=Math.floor(t.m-now+1e-4);return d<=0?"まもなく":d<60?`${d}分`:`${Math.floor(d/60)}時間${d%60?d%60+"分":""}`}
function rowHTML(t,rt,now){const s=subText(t,rt,true);return `<div class="row"><span class="t">${fmt(t.m)}</span><span class="d">${destText(t,rt)}${s?`<small>${s}</small>`:""}</span>${rt.ltd?"":badge(t,true)}${now!=null?`<span class="m">${untilText(t,now)}</span>`:""}</div>`}

function renderNav(){
 const tb=document.getElementById("tabbar");
 tb.innerHTML=GROUPS.map((g,i)=>`<button role="tab" aria-selected="${i===st.g}" data-i="${i}">${ICON[g.icon]}<span>${g.label}</span></button>`).join("");
 const g=GROUPS[st.g],seg=document.getElementById("seg");
 if(g.routes.length<2){seg.style.display="none"}else{
  seg.style.display="";
  seg.innerHTML='<span class="thumb"></span>'+g.routes.map((r,i)=>`<button role="tab" aria-selected="${i===st.r[st.g]}" data-i="${i}">${r.seg}</button>`).join("");
  requestAnimationFrame(moveThumb);
 }
 const rt=route();
 document.getElementById("kbtn").style.display=rt.ltd?"none":"";
 document.getElementById("kbtn").setAttribute("aria-pressed",st.k);
 document.getElementById("title").textContent=rt.title;
 document.getElementById("from").textContent=rt.from;
}
function moveThumb(){const seg=document.getElementById("seg"),b=seg.querySelector('[aria-selected="true"]'),th=seg.querySelector(".thumb");if(b&&th){th.style.left=b.offsetLeft+"px";th.style.width=b.offsetWidth+"px"}}

function render(){
 if(!DATA)return;
 const n=jst();let sd={y:n.y,mo:n.mo,d:n.d},now=n.h*60+n.mi+n.s/60;
 if(n.h<4){sd=addDay(n.y,n.mo,n.d,-1);now+=1440}
 const type=st.day==="auto"?dayType(sd.y,sd.mo,sd.d):st.day;
 document.getElementById("clock").textContent=`${n.mo}月${n.d}日 ${n.h}:${pad(n.mi)}`;
 document.getElementById("daybtn").innerHTML=`<span class="dot"></span>${type==="wd"?"平日":"土休日"}${st.day==="auto"?"":"（手動）"}`;
 const rt=route(),all=list(rt,type),up=all.filter(t=>t.m>=Math.floor(now));
 const has=(DATA.tables[rt.src+"_"+type]||[]).length>0;
 let h="";
 if(!has){
  h=`<div class="hero glass"><div class="empty"><b>データ準備中</b>次の自動更新（毎朝4時台）で入ります</div></div>`;
 }else if(!up.length){
  const nx=addDay(sd.y,sd.mo,sd.d,1),nt=st.day==="auto"?dayType(nx.y,nx.mo,nx.d):type,f=list(rt,nt)[0];
  h=`<div class="hero glass"><div class="empty"><b>${rt.ltd?"本日の特急は終了":"本日の運転は終了"}</b>${f?`明日の${rt.ltd?"最初の特急":"始発"} ${fmt(f.m)}`:""}</div></div>`;
 }else{
  const [a,...more]=up,next=more.slice(0,2),d=Math.floor(a.m-now+1e-4),s=subText(a,rt);
  h=`<div class="hero glass"><div class="hero-main${arrText(a,rt)||a.best?" has-sub":""}"><div><div class="t">${fmt(a.m)}</div><div class="meta">${badge(a)}<span>${destText(a,rt)}</span>${s?`<span class="note">${s}</span>`:""}</div></div>
   <div class="cd"><small>${d<=0?"":"あと"}</small><b class="${d<=2?"soon":d>=60?"long":""}${d<=0?" long":""}">${untilText(a,now)}</b></div></div>
   ${arrText(a,rt)||a.best?`<div class="hero-sub">${arrText(a,rt)?`<div class="arr">→ ${arrText(a,rt)}</div>`:""}${xferLine(a)}</div>`:""}
   ${next.length?`<div class="rows">${next.map(t=>rowHTML(t,rt,now)).join("")}</div>`:""}</div>`;
  const rest=up.slice(3),shown=st.open?rest:rest.slice(0,MORE_N),left=rest.length-shown.length;
  if(rest.length)h+=`<div class="sec">この後の発車</div><div class="list">${shown.map(t=>rowHTML(t,rt,null)).join("")}${left>0?`<button class="more" id="morebtn">もっと見る（あと${left}本）</button>`:st.open&&rest.length>MORE_N?`<button class="more" id="morebtn">閉じる</button>`:""}</div>`;
 }
 document.getElementById("out").innerHTML=h;
}

document.getElementById("out").onclick=e=>{if(e.target.id!=="morebtn")return;const close=st.open;st.open=!st.open;render();if(close)scrollTo({top:0,behavior:"smooth"})};
document.getElementById("tabbar").onclick=e=>{const b=e.target.closest("button");if(!b)return;st.g=+b.dataset.i;st.open=false;save();renderNav();render();scrollTo({top:0,behavior:"smooth"})};
document.getElementById("seg").onclick=e=>{const b=e.target.closest("button");if(!b)return;st.r[st.g]=+b.dataset.i;st.open=false;save();renderNav();render()};
document.getElementById("kbtn").onclick=()=>{st.k=!st.k;save();renderNav();render()};
document.getElementById("daybtn").onclick=()=>{st.day=st.day==="auto"?"wd":st.day==="wd"?"hd":"auto";render()};
addEventListener("resize",moveThumb);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});
renderNav();
// 時刻表を最後に確認できた日を出す。3日以上古ければ、自動更新が止まっている可能性を知らせる
function showStamp(d,c){
 const el=document.getElementById("stamp"),day=c||d.updated;if(!day||!el)return;
 const today=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
 const age=Math.round((Date.parse(today)-Date.parse(day))/864e5);
 const md=day.slice(5).replace("-","/").replace(/^0/,"").replace("/0","/");
 const top=document.getElementById("stale");
 if(age>=3){const m=`時刻表は ${md} 以降確認できていません（${age}日前）。自動更新が止まっている可能性があります`;
  el.className="stamp warn";el.textContent=m;
  top.textContent="⚠ "+m;top.classList.add("on")}
 else{el.textContent=`時刻表の最終確認 ${md}`;top.classList.remove("on")}}
const checkedP=fetch("checked.json?"+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null);
fetch("data.json?"+Date.now()).then(r=>r.json()).then(d=>{checkedP.then(c=>showStamp(d,c&&c.checked));DATA=d;const v=d.versions||{};document.getElementById("meta").textContent=`データ更新日 ${d.updated}${d.note?"・"+d.note:""}`;render()})
 .catch(()=>{document.getElementById("out").innerHTML='<div class="hero glass"><div class="empty"><b>読み込めませんでした</b>電波の良い所で開き直してください</div></div>'});
setInterval(render,5000);
</script>
</body>
</html>
